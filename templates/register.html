{% extends "base.html" %}

{% block title %}Register - Hospital AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-8 col-lg-6">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="fa-solid fa-user-plus fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Create Account</h3>
                        <p class="text-muted small">Register as a patient or hospital medical staff</p>
                    </div>

                    <form method="POST" action="{{ url_for('register') }}">
                        <div class="row g-3">
                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary">Full Name</label>
                                <input type="text" name="name" class="form-control" placeholder="Dr. Jane Smith or John Doe" required>
                            </div>

                            <div class="col-12">
                                <label class="form-label small fw-semibold text-secondary">Email Address</label>
                                <input type="email" name="email" class="form-control" placeholder="user@hospital.ai" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-secondary">Password</label>
                                <input type="password" name="password" class="form-control" placeholder="••••••••" required>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-secondary">Role</label>
                                <select name="role" class="form-select" required>
                                    <option value="patient" selected>Patient</option>
                                    <option value="doctor">Doctor / Physician</option>
                                </select>
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-secondary">Phone Number</label>
                                <input type="tel" name="phone" class="form-control" placeholder="+1 (555) 000-0000">
                            </div>

                            <div class="col-md-6">
                                <label class="form-label small fw-semibold text-secondary">Specialty / Details</label>
                                <input type="text" name="specialty" class="form-control" placeholder="e.g. Cardiology (Doctors)">
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mt-4">
                            <i class="fa-solid fa-check me-2"></i>Create Account
                        </button>
                    </form>

                    <div class="text-center mt-3">
                        <span class="text-muted small">Already have an account?</span>
                        <a href="{{ url_for('login') }}" class="small fw-semibold text-decoration-none">Sign in</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
