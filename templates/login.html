{% extends "base.html" %}

{% block title %}Sign In - Hospital AI{% endblock %}

{% block content %}
<div class="container py-4">
    <div class="row justify-content-center">
        <div class="col-md-7 col-lg-5">
            <div class="card shadow-lg border-0">
                <div class="card-body p-4 p-md-5">
                    <div class="text-center mb-4">
                        <div class="d-inline-flex p-3 rounded-circle bg-primary bg-opacity-10 text-primary mb-3">
                            <i class="fa-solid fa-heart-pulse fa-2x"></i>
                        </div>
                        <h3 class="fw-bold text-dark">Hospital AI Portal</h3>
                        <p class="text-muted small">Sign in with your role-based hospital credentials</p>
                    </div>

                    <form method="POST" action="{{ url_for('login') }}">
                        <div class="mb-3">
                            <label class="form-label small fw-semibold text-secondary">Email Address</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-envelope"></i></span>
                                <input type="email" name="email" id="email" class="form-control" placeholder="name@hospital.ai" required autofocus>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label class="form-label small fw-semibold text-secondary">Password</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light text-muted"><i class="fa-solid fa-lock"></i></span>
                                <input type="password" name="password" id="password" class="form-control" placeholder="••••••••" required>
                            </div>
                        </div>

                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold mb-3">
                            <i class="fa-solid fa-right-to-bracket me-2"></i>Sign In
                        </button>
                    </form>

                    <!-- Quick Demo Credentials Selector -->
                    <div class="border-top pt-3 mt-3">
                        <p class="text-muted small fw-semibold mb-2 text-center">Quick Demo Login (One-Click Auto-Fill):</p>
                        <div class="d-grid gap-2">
                            <button type="button" class="btn btn-outline-danger btn-sm text-start" onclick="fillCreds('admin@hospital.ai', 'Admin@123')">
                                <i class="fa-solid fa-user-shield me-2"></i><strong>Admin:</strong> admin@hospital.ai
                            </button>
                            <button type="button" class="btn btn-outline-primary btn-sm text-start" onclick="fillCreds('dr.sarah@hospital.ai', 'Doctor@123')">
                                <i class="fa-solid fa-user-doctor me-2"></i><strong>Doctor:</strong> dr.sarah@hospital.ai
                            </button>
                            <button type="button" class="btn btn-outline-success btn-sm text-start" onclick="fillCreds('john.doe@patient.ai', 'Patient@123')">
                                <i class="fa-solid fa-user me-2"></i><strong>Patient:</strong> john.doe@patient.ai
                            </button>
                        </div>
                    </div>

                    <div class="text-center mt-4">
                        <span class="text-muted small">Need an account?</span>
                        <a href="{{ url_for('register') }}" class="small fw-semibold text-decoration-none">Register here</a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
function fillCreds(email, password) {
    document.getElementById('email').value = email;
    document.getElementById('password').value = password;
}
</script>
{% endblock %}
